services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: woc
      POSTGRES_PASSWORD: woc
      POSTGRES_DB: woc
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U woc"]
      interval: 3s
      retries: 20
  api:
    build: apps/api
    environment:
      DATABASE_URL: postgresql+asyncpg://woc:woc@db:5432/woc
      SIM_SEED: "42"
      SIM_ROBOTS: "200"
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
