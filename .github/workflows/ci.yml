name: ci
on:
  push:
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/web lint
      - run: pnpm --dir apps/web typecheck
      - run: pnpm --dir apps/web test
      - run: pnpm --dir apps/web i18n:check
      - run: pnpm --dir apps/web build
      - run: pnpm --dir apps/web exec playwright install --with-deps chromium
      - name: e2e smoke (mock mode)
        run: pnpm --dir apps/web e2e

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: uv sync
        working-directory: apps/api
      - run: uv run ruff check . && uv run ruff format --check .
        working-directory: apps/api
      - run: uv run pytest -q
        working-directory: apps/api
      - name: OpenAPI drift check
        run: |
          pnpm install --frozen-lockfile
          (cd apps/api && uv run python -m app.export_openapi openapi.json)
          pnpm --dir apps/web gen-api
          git diff --exit-code apps/api/openapi.json apps/web/src/api/schema.d.ts
