[project]
name = "woc-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "sqlalchemy[asyncio]>=2",
  "asyncpg",
  "pydantic>=2",
]

[dependency-groups]
dev = ["pytest", "httpx", "ruff", "aiosqlite"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
